<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F4F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dayline">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="web/apple-touch-icon.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
  <title>Dayline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="sys-toasts" aria-live="polite"></div>
  <input type="file" id="file-import" accept="application/json" hidden>
  <input type="file" id="file-any" multiple hidden>
  <input type="file" id="file-img" accept="image/*" multiple hidden>
  <input type="file" id="file-text" accept=".txt,.md,.markdown,.csv,text/plain,text/markdown" hidden>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
